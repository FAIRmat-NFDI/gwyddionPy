{% set name = "gwyddionpy-converter" %}
{% set version = "0.1.0" %}
# Keep in step with `gwyddion-version` in ../pyproject.toml.
{% set gwyddion_version = "2.71" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

# PyPI has only prebuilt wheels for this package, so it is built from source:
# Gwyddion itself, and gwyconvert.c from the gwyddionPy release tag.
source:
  - url: https://downloads.sourceforge.net/project/gwyddion/gwyddion/{{ gwyddion_version }}/gwyddion-{{ gwyddion_version }}.tar.xz
    sha256: 2df721befccbe4d5ee2ba564b32e69341f8ce1de637e2045838a09a2d46b5dba
    folder: gwyddion
  - url: https://github.com/FAIRmat-NFDI/gwyddionPy/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 403daeab5e51931e93253fb85dcf94201cf61db92471a32cc3ffdd69acd825ec
    folder: gwyddionpy

build:
  number: 0
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - gnuconfig  # [unix]
    - make
    - pkg-config
  host:
    - gtk2
    - glib
    - fftw
    - libxml2
    - libpng
    - libzip
    - zlib
    - bzip2

test:
  commands:
    - test -x "${PREFIX}/bin/gwyconvert"
    # A build that lost its file modules still exits 0, so count the formats.
    - test "$(gwyconvert --list-formats | grep -c '"name"')" -gt 100

about:
  home: https://github.com/FAIRmat-NFDI/gwyddionPy
  summary: The gwyconvert binary that lets gwyddionpy read vendor SPM files through Gwyddion.
  description: |
    Installs `gwyconvert` on `PATH`, together with the Gwyddion libraries and
    file modules it links. `gwyddionpy` finds the binary on `PATH`.
  license: GPL-2.0-or-later
  license_family: GPL
  license_file:
    - gwyddionpy/gwyddionpy-converter/COPYING
    - gwyddion/COPYING
  dev_url: https://github.com/FAIRmat-NFDI/gwyddionPy

extra:
  recipe-maintainers:
    - RubelMozumder
