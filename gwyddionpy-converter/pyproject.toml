[build-system]
requires = ["setuptools>=78.1.1", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwyddionpy-converter"
dynamic = ["version"]
authors = [
    { name = "The NOMAD Authors" },
]
description = "Prebuilt gwyconvert binary bundle for gwyddionpy (GPL-2.0-or-later companion package)"
readme = "README.md"
license = { file = "COPYING" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
"Homepage" = "https://github.com/FAIRmat-NFDI/gwyddionPy"
"Parent Project" = "https://github.com/FAIRmat-NFDI"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# This package is only published to TestPyPI so far; extra-index-url
# keeps real PyPI available as a fallback for its build/dev dependencies.
index-url = "https://test.pypi.org/simple"
extra-index-url = ["https://pypi.org/simple"]

[tool.cibuildwheel]
# One wheel per platform, not per Python version. The payload is a
# standalone executable run via subprocess, so it depends on no Python ABI
# and setup.py tags it py3-none-<platform>; building it once per Python
# would repeat a multi-minute Gwyddion build for byte-identical results.
# cibuildwheel has no "build once" identifier of its own — its identifiers
# are always version-specific — so pinning to a single interpreter is how
# that is expressed. Verified 2026-07-29 that it accepts the resulting
# py3-none wheel without complaint (V1_IMPLEMENTATION.md, V1d-0).
build = "cp312-*"

# musllinux is deliberately out of scope (target set is Linux glibc, macOS
# arm64/x86_64, Windows x86_64). Skipping it also avoids building the whole
# GTK2 stack a second time against musl for users we do not have.
skip = "*musllinux*"

# glibc 2.28 floor, matching the Rocky Linux 8 recipe this replaces: covers
# RHEL/Rocky/Alma 8+, Debian 10+, Ubuntu 18.10+. A newer default would
# silently exclude RHEL 9 (2.34) and Debian bookworm (2.36) — both of which
# this project has already been bitten by (V1_IMPLEMENTATION.md 2026-07-22).
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "bash {project}/ci/cibw-before-all-linux.sh"
# setuptools-scm derives the version from git tags via root = ".." (the repo
# root). cibuildwheel copies only *this* package directory into the build
# container, so .git is not reachable from inside it and setuptools-scm
# cannot resolve a version on its own. The caller must pass one in;
# environment-pass forwards it from the host into the container. publish.yml
# sets it from the release tag, matching the lockstep pin on the gwyddionpy
# side. Locally: export it to whatever you want the wheel called.
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY_CONVERTER"]
# The bundle staged by before-all is already self-contained and
# RPATH-patched by bundle-linux.sh, which walks the dlopen()'d format
# plugins auditwheel cannot see. Running auditwheel on top would at best
# duplicate work and at worst rewrite the RPATHs just set, so the repair
# step is a plain copy. See docs/gwyddionpy-build-as-matid.md.
repair-wheel-command = "cp {wheel} {dest_dir}"

# Cheap but load-bearing smoke test: a bundle that lost its format plugins
# still exits 0 and reports an empty list, which is exactly how two of this
# project's bugs presented (V1_IMPLEMENTATION.md 2026-07-22). Assert on the
# count rather than on the exit status.
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""

[tool.cibuildwheel.macos]
# "native" only, never a universal2 or cross build: Homebrew ships bottles
# for the host architecture alone, so an arm64 wheel built on an Intel runner
# would have no arm64 GTK2/GLib/FFTW to link against. Coverage comes from
# running this on two runners (macos-15 for arm64, macos-15-intel for
# x86_64), which is the same shape matid uses.
archs = ["native"]
before-all = "bash {project}/ci/cibw-before-all-macos.sh"
# Same reasoning as Linux: bundle-macos.sh has already rewritten every
# install name to @loader_path and re-signed the results, and delocate
# cannot see Gwyddion's dlopen()'d format plugins. Letting it run would
# duplicate the work and risk undoing the rewrites.
repair-wheel-command = "cp {wheel} {dest_dir}"
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""
# No environment-pass here: that option is Linux-only — it exists to forward
# variables across the Docker container boundary. macOS and Windows builds
# run directly on the host, so SETUPTOOLS_SCM_PRETEND_VERSION_FOR_* is
# already visible to the build without forwarding.

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# No before-all here, unlike Linux/macOS: cibuildwheel runs Windows commands
# under cmd, and the Gwyddion build needs a full MSYS2 MinGW64 shell. The
# workflow instead runs ci/build-windows-bundle.sh as its own msys2-shell
# step BEFORE cibuildwheel; setup.py's missing-bundle guard turns any
# ordering mistake into a loud failure instead of an empty wheel.
#
# repair: cibuildwheel's Windows default is delvewheel, which would try to
# re-bundle DLLs the bundle script already placed (and cannot see the
# dlopen'd modules' deps in any case). A python one-liner instead of `cp`
# because this runs under cmd, not a POSIX shell.
repair-wheel-command = "python -c \"import shutil,sys;shutil.copy(sys.argv[1],sys.argv[2])\" {wheel} {dest_dir}"
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""

[tool.setuptools_scm]
# Same repo, same tags as gwyddionpy/pyproject.toml's [tool.setuptools_scm]
# (OQ7c: converter releases share the Python package's tag) — both packages
# derive their version from the identical git tag automatically, with no
# extra wiring needed.
root = ".."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
