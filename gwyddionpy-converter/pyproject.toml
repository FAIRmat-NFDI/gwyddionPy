[build-system]
requires = ["setuptools>=78.1.1", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwyddionpy-converter"
dynamic = ["version"]
authors = [
    { name = "The NOMAD Authors" },
]
description = "Prebuilt gwyconvert binary bundle for gwyddionpy (GPL-2.0-or-later companion package)"
readme = "README.md"
license = { file = "COPYING" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    # One wheel per platform; keep in step with the runner matrix in
    # .github/workflows/build-converter.yml.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
"Homepage" = "https://github.com/FAIRmat-NFDI/gwyddionPy"
"Parent Project" = "https://github.com/FAIRmat-NFDI"

# Settings this project's own build scripts read. A [tool.*] table the build
# backend does not recognise is ignored, which is what makes this a safe
# place to keep them.
[tool.gwyconvert]
# The Gwyddion release every shipped artifact is built from — wheels,
# release tarball, and the source-tarball test job alike. The single source
# of truth: ci/build-gwyddion.sh reads this value, so changing it here
# changes every build. GWYDDION_VERSION in the environment still overrides
# it for a one-off local build.
#
# Not used by pytest.yml's `pytest-system-package` job, which deliberately
# tests whatever Gwyddion the distribution packages; see the comment there.
#
# Upstream releases:
# https://sourceforge.net/projects/gwyddion/files/gwyddion/
gwyddion-version = "2.71"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Published to TestPyPI only so far. Drop both lines at production PyPI
# (gwyddionpy/pyproject.toml has the same pair).
index-url = "https://test.pypi.org/simple"
extra-index-url = ["https://pypi.org/simple"]

# Four targets: Linux x86_64, macOS arm64 and x86_64, Windows x86_64.
# https://cibuildwheel.pypa.io/en/stable/options/
[tool.cibuildwheel]
# One interpreter, because the payload depends on no Python application
# binary interface (ABI) and setup.py tags the wheel py3-none-<platform>.
# Building every version would repeat a 20-minute Gwyddion build for
# identical output.
build = "cp312-*"

# musllinux would mean building the whole GTK2 stack a second time against
# musl. Removing this line silently adds that build.
skip = "*musllinux*"

# A glibc 2.28 floor covers RHEL 8+, Debian 10+ and Ubuntu 18.10+, and
# matches the tarball job in build-converter.yml so both artifacts have the
# same reach. https://peps.python.org/pep-0600/
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# {package}, not {project}: {project} resolves to the repo root, which has
# no ci/ directory, and does so silently.
before-all = "bash {package}/ci/cibw-before-all-linux.sh"

# setuptools-scm reads git tags through root = "..", and .git is not usable
# inside the build container, so the version crosses that boundary here.
# Linux only; macOS and Windows build on the host and already see it.
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY_CONVERTER"]

# No auditwheel: bundle-linux.sh already produced a self-contained bundle,
# and it walks the loadable format plugins auditwheel cannot see. Repairing
# again would duplicate that and could undo the library paths just set.
repair-wheel-command = "cp {wheel} {dest_dir}"

# A bundle that lost its plugins still exits 0 and prints an empty list, so
# this asserts on the format count rather than the exit status.
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""

[tool.cibuildwheel.macos]
# "native" only, never universal2 or a cross build: Homebrew ships bottles
# for the host architecture alone. Two runners cover both architectures.
archs = ["native"]
before-all = "bash {package}/ci/cibw-before-all-macos.sh"
# No delocate, for the Linux reason: bundle-macos.sh already rewrote every
# install name and re-signed the results, and would risk undoing them.
repair-wheel-command = "cp {wheel} {dest_dir}"
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# No before-all: cibuildwheel runs Windows commands under cmd, while the
# Gwyddion build needs an MSYS2 MinGW64 shell. build-converter.yml runs
# ci/build-windows-bundle.sh as its own step first — change one, change the
# other. setup.py's _check_bundle_present() catches an ordering mistake.
#
# No delvewheel: it would re-bundle libraries already placed, and cannot see
# the loadable modules' own dependencies. Written as a Python one-liner
# rather than `cp` because this runs in cmd.
repair-wheel-command = "python -c \"import shutil,sys;shutil.copy(sys.argv[1],sys.argv[2])\" {wheel} {dest_dir}"
test-command = "python -c \"import json,subprocess;from gwyddionpy_converter import binary_path;n=len(json.loads(subprocess.run([str(binary_path()),'--list-formats'],capture_output=True,text=True,check=True).stdout));print(f'{n} formats');assert n>100,f'only {n} formats - bundle is missing its plugins'\""

[tool.setuptools_scm]
# The repo root, so this package and gwyddionpy take their version from the
# same git tag. publish.yml's lockstep pin relies on that.
root = ".."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
