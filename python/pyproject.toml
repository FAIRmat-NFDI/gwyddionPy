[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwyddionpy"
version = "0.1.0.dev0"
description = "Read any Gwyddion-supported SPM raw file into NumPy via the gwyconvert helper"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Rubel", email = "rubel.phy09201147@gmail.com" }]
dependencies = [
    "numpy>=1.22",
    "gwyfile>=0.3",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.0"]
test = ["pytest>=7", "h5py>=3.0", "pooch>=1.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/gwyddionpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: tests needing full-size raw files fetched from the corpus host",
    "converter: tests needing a built gwyconvert binary",
]
