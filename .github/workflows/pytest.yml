name: pytest

on:
  push:
    branches: [main, "*"]
  # pull_request:
  #   branches: [main]

jobs:
  # Two independent jobs (no `needs:` between them) covering the two ways a
  # developer can obtain gwyconvert. Both are kept: pytest-source-tarball
  # exercises the recipe released artifacts are built from
  # (gwyddionpy-converter/ci/build-gwyddion.sh), while pytest-system-package
  # exercises the distro-package route contributors actually reach for
  # locally, which nothing else would catch if it broke.

  pytest-system-package:
    name: pytest (system Gwyddion package)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # `gwyddion` itself is required, not just libgwyddion20-dev: Debian
      # and Ubuntu ship the file-format module plugins (~170 .so files that
      # gwyconvert dlopen()s at runtime) in the `gwyddion` binary package,
      # while the -dev package carries only headers and link libraries.
      # Omit it and gwyconvert builds, links and runs — reporting zero
      # formats. Keep this list in sync with docs/user/how-to.md.
      - name: Install Gwyddion (system package)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgwyddion20-dev gwyddion libgtk2.0-dev libfftw3-dev pkg-config build-essential

      # The locale tests prove the reader is independent of the machine's
      # number formatting, and cannot do so unless a comma-decimal locale
      # exists to compare against. The runner image ships only C and English
      # ones, so generate one rather than let the tests skip themselves.
      - name: Generate a comma-decimal locale
        run: |
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8

      - name: Build gwyconvert
        run: |
          make -C gwyddionpy-converter
          make -C gwyddionpy-converter check

      - name: Install uv and set the python version to ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gwyddionpy
        run: uv pip install "./gwyddionpy[test]"

      - name: Test with pytest
        env:
          GWYDDIONPY_CONVERT: ${{ github.workspace }}/gwyddionpy-converter/gwyconvert
          # Declares which platform this leg is. A job that ends up on the
          # wrong image stops with an error instead of reporting a green run
          # for a platform it never tested.
          GWYDDIONPY_REQUIRE_PLATFORM: linux
        run: pytest gwyddionpy/tests

  pytest-source-tarball:
    name: pytest (Gwyddion built from source tarball)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Build dependencies only — Gwyddion itself is built from its official
      # source tarball by ci/build-gwyddion.sh, the same script
      # build-converter.yml uses. Testing against that rather than the
      # distro package means this job matches what actually ships, and does
      # not depend on how a distribution happens to split its Gwyddion
      # packages (the exact assumption the job above documents).
      - name: Install build dependencies for Gwyddion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl libgtk2.0-dev libfftw3-dev libxml2-dev gettext

      # See the note in pytest-system-package: the locale tests need a
      # comma-decimal locale to exist before they can demonstrate anything.
      - name: Generate a comma-decimal locale
        run: |
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8

      - name: Build Gwyddion + gwyconvert from source
        env:
          WORK_DIR: ${{ github.workspace }}/gwyddion-build
          PREFIX: ${{ github.workspace }}/gwyddion-build/install
          GWYCONVERT_OUT: ${{ github.workspace }}/gwyddionpy-converter/gwyconvert
        run: gwyddionpy-converter/ci/build-gwyddion.sh

      - name: Install uv and set the python version to ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gwyddionpy
        run: uv pip install "./gwyddionpy[test]"

      - name: Test with pytest
        env:
          GWYDDIONPY_CONVERT: ${{ github.workspace }}/gwyddionpy-converter/gwyconvert
          # Declares which platform this leg is. A job that ends up on the
          # wrong image stops with an error instead of reporting a green run
          # for a platform it never tested.
          GWYDDIONPY_REQUIRE_PLATFORM: linux
        run: pytest gwyddionpy/tests

  # ---------------------------------------------------------------------
  # The converter this branch builds, on every platform it is built for.
  #
  # These legs used to install gwyddionpy-converter from the index, which
  # meant they tested the last *release*: a change to gwyconvert.c or to a
  # build recipe could not be checked until after it had shipped, and four
  # genuine bugs — macOS arm64 registering eight formats fewer than x86_64,
  # unreadable non-ASCII paths on Windows, numbers coming back with commas
  # there, and a GLib assertion on every run — reached users because nothing
  # ever ran the suite against a converter built from the source under
  # review. Building it here is what makes this a gate rather than a report
  # on an artifact the change cannot affect.
  #
  # The build is the one in build-converter.yml, called rather than copied,
  # so there is a single recipe and releases and tests cannot diverge.
  # ---------------------------------------------------------------------
  build-converter:
    name: Build the converter wheels
    # Empty tag: this is a test build, so the wheels are the throwaway
    # 0.0.0 and the release-upload step inside stays switched off.
    uses: ./.github/workflows/build-converter.yml
    with:
      tag: ""

  pytest-built-wheel:
    name: pytest (built wheel, ${{ matrix.platform }})
    needs: build-converter
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: macos-15-intel
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      # A comma-decimal locale is generated on Linux because the locale
      # tests prove independence from it, and cannot do so if none exists.
      - name: Generate a comma-decimal locale (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8

      - name: Collect the wheel built for this platform
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Installed into the environment setup-uv created and put on PATH, as
      # the other jobs do. Not --system: that bypasses it for the
      # interpreter the image happens to ship, which on Ubuntu is externally
      # managed and refuses the install outright, and on macOS installs
      # somewhere pytest is then not found.
      #
      # Named by path rather than as a requirement: a test build carries the
      # throwaway version 0.0.0, and naming the file is also what guarantees
      # the wheel under test is the one just built and not one resolved from
      # an index.
      - name: Install gwyddionpy and the converter wheel built here
        shell: bash
        run: |
          uv pip install wheelhouse/*.whl
          uv pip install "./gwyddionpy[test]"

      - name: Test with pytest
        shell: bash
        env:
          GWYDDIONPY_REQUIRE_PLATFORM: ${{ matrix.platform }}
        run: pytest gwyddionpy/tests gwyddionpy-converter/tests
