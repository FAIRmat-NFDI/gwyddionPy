name: Publish wheels to TestPyPI

# Publishes both packages — gwyddionpy (Apache-2.0, pure Python) and
# gwyddionpy-converter (GPL-2.0-or-later, prebuilt binaries) — from one
# workflow, so they share a single converter build and one release tag.
#
# The graph is a chain, not a fan-out: the converter must reach the index
# before gwyddionpy does (see publish-python-wheel).
#
#   build-converter ─┬─> build-python-wheel ──────────┐
#                    └─> publish-converter-wheel ─────┴─> publish-python-wheel
on:
  release:
    types: [published]

jobs:
  build-converter:
    name: Build gwyconvert (linux-x86_64)
    uses: ./.github/workflows/build-converter.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  build-python-wheel:
    name: Build gwyddionpy package
    # More than ordering: the lockstep pin below makes a released
    # gwyddionpy hard-require the converter from this same tag, so building
    # it while the converter build is broken would ship a package whose
    # `[converter]` extra can never resolve.
    needs: build-converter
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tags, so both flags
          # are required. fetch-depth alone is not enough: actions/checkout
          # unshallows history but does not fetch tags unless asked. Without
          # the tags `git describe` produces a dev version carrying a local
          # segment (0.0.14.post1.dev0+g...), which PyPI rejects outright
          # ("local versions are not allowed").
          # https://peps.python.org/pep-0440/#local-version-identifiers
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Lockstep versioning: both packages take their version from this git
      # tag and are published by this run, so the released gwyddionpy must
      # require exactly the converter from the same tag.
      #
      # Applied here rather than committed to pyproject.toml, for two
      # reasons: the version is dynamic, so it cannot be written literally;
      # and a checkout/editable install must keep resolving the UNPINNED
      # requirement, since its dev version corresponds to no published
      # converter and an `==` pin on it could never be satisfied.
      #
      # The regex below must keep matching gwyddionpy/pyproject.toml's
      # `converter = ["gwyddionpy-converter"]` line — reword that line and
      # this step fails loudly (by design, see the `count != 1` check).
      # Tags are "v"-prefixed, versions are not; _fetch_converter._release_tag()
      # performs the same conversion in the other direction.
      - name: Pin gwyddionpy-converter to this exact release
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          path = pathlib.Path("gwyddionpy/pyproject.toml")
          text = path.read_text()
          new_text, count = re.subn(
              r'^converter = \["gwyddionpy-converter"\]$',
              f'converter = ["gwyddionpy-converter=={version}"]',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          # Fail loudly rather than silently shipping an unpinned release if
          # the extra is ever reworded or moved.
          if count != 1:
              sys.exit(
                  "lockstep pin FAILED: no line matching "
                  '\'converter = ["gwyddionpy-converter"]\' in '
                  f"{path}. Update this step to match the current form."
              )
          path.write_text(new_text)
          print(f"pinned gwyddionpy-converter=={version}")
          PY

      # The pin above rewrites pyproject.toml in place, which leaves the
      # working tree dirty — and setuptools-scm treats a dirty tree as "not
      # a clean release" even when sitting exactly on the tag, producing a
      # version with a local segment that PyPI rejects. Pretending the
      # version sidesteps git state entirely, as the converter build already
      # does with SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY_CONVERTER.
      # https://setuptools-scm.readthedocs.io/en/latest/overrides/
      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY: ${{ env.VERSION }}
        run: uv build ./gwyddionpy --out-dir dist

      # The edit above only proves the file changed; this proves the pin
      # reached the metadata pip actually reads.
      - name: Verify the lockstep pin reached the built metadata
        run: |
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import glob, sys, zipfile

          version = sys.argv[1]
          expected = f"Requires-Dist: gwyddionpy-converter=={version}; extra == \"converter\""
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel found in dist/")
          archive = zipfile.ZipFile(wheels[0])
          name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(name).decode()
          if expected not in metadata:
              print(metadata)
              sys.exit(f"lockstep pin missing from {wheels[0]}: expected {expected!r}")
          print(f"verified in {wheels[0]}: {expected}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  publish-python-wheel:
    # TODO: Use PyPI in production
    name: Upload gwyddionpy to TestPyPI
    # Ordering is load-bearing: gwyddionpy publishes AFTER the converter,
    # never in parallel. Its lockstep pin hard-requires
    # `gwyddionpy-converter==<this tag>`, so a converter upload that fails
    # while this one succeeds would leave a published `[converter]` extra
    # that can never resolve — unfixable, since PyPI forbids re-uploading a
    # version. Depending on publish-converter-wheel skips this job instead.
    #
    # The reverse failure is harmless: a converter nothing references yet
    # just sits unused. Recovery is a plain re-run — both publish steps set
    # `skip-existing: true`, so only the failed upload retries.
    needs: [build-python-wheel, publish-converter-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gwyddionpy
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-converter-wheel:
    # Collect-and-upload only. The wheels are built by build-converter.yml's
    # `wheels` matrix (manylinux_2_28, macos-15 arm64, macos-15-intel,
    # windows-latest) and arrive here as artifacts of the same run.
    name: Publish gwyddionpy-converter wheels
    needs: build-converter
    runs-on: ubuntu-latest
    environment:
      name: testpypi-converter
      url: https://test.pypi.org/p/gwyddionpy-converter
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - name: Collect the wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist/
          merge-multiple: true

      # Wheels only, never an sdist: an sdist would let pip fall back to
      # building Gwyddion from source on any machine without a matching
      # wheel. The count check catches the other failure — publishing an
      # empty dist/ "successfully" would silently break the lockstep pin.
      - name: Fail rather than publish an empty release
        run: |
          ls -l dist/
          count=$(ls dist/*.whl 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "no wheels collected — refusing to publish" >&2
            exit 1
          fi
          echo "$count wheel(s) ready"

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
