name: Publish wheels to PyPI

# Publishes both packages — gwyddionpy (Apache-2.0, pure Python) and
# gwyddionpy-converter (GPL-2.0-or-later, prebuilt binaries) — from one
# workflow, so they share a single converter build and one release tag.
#
# The graph is a chain, not a fan-out: the converter must reach the index
# before gwyddionpy does (see publish-python-wheel).
#
#   build-converter ─┬─> build-python-wheel ──────────┐
#                    └─> publish-converter-wheel ─────┴─> publish-python-wheel
on:
  release:
    types: [published]

jobs:
  build-converter:
    name: Build gwyconvert (linux-x86_64)
    uses: ./.github/workflows/build-converter.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit

  build-python-wheel:
    name: Build gwyddionpy package
    # More than ordering: the pin below makes a released gwyddionpy require
    # the converter from this tag, so building it while the converter build
    # is broken would ship an extra that can never resolve.
    needs: build-converter
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both flags are required: actions/checkout unshallows history but
          # does not fetch tags unless asked, and without tags
          # setuptools-scm produces a local version PyPI rejects.
          # https://peps.python.org/pep-0440/#local-version-identifiers
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Lockstep versioning: both packages take their version from this tag,
      # so the released gwyddionpy must require exactly the converter from
      # it. Applied here rather than committed, because the version is
      # dynamic and a checkout must keep resolving the unpinned requirement.
      #
      # The regex must keep matching gwyddionpy/pyproject.toml's
      # `converter = ["gwyddionpy-converter"]` line; the `count != 1` check
      # below fails loudly if that line is reworded.
      - name: Pin gwyddionpy-converter to this exact release
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          path = pathlib.Path("gwyddionpy/pyproject.toml")
          text = path.read_text()
          new_text, count = re.subn(
              r'^converter = \["gwyddionpy-converter"\]$',
              f'converter = ["gwyddionpy-converter=={version}"]',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          # Fail loudly rather than silently shipping an unpinned release if
          # the extra is ever reworded or moved.
          if count != 1:
              sys.exit(
                  "lockstep pin FAILED: no line matching "
                  '\'converter = ["gwyddionpy-converter"]\' in '
                  f"{path}. Update this step to match the current form."
              )
          path.write_text(new_text)
          print(f"pinned gwyddionpy-converter=={version}")
          PY

      # The pin above leaves the working tree dirty, and setuptools-scm
      # treats that as "not a clean release" even when sitting on the tag,
      # producing a local version PyPI rejects. Pretending the version
      # sidesteps git state, as the converter build already does.
      # https://setuptools-scm.readthedocs.io/en/latest/overrides/
      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY: ${{ env.VERSION }}
        run: uv build ./gwyddionpy --out-dir dist

      # The edit above only proves the file changed; this proves the pin
      # reached the metadata pip actually reads.
      - name: Verify the lockstep pin reached the built metadata
        run: |
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import glob, sys, zipfile

          version = sys.argv[1]
          expected = f"Requires-Dist: gwyddionpy-converter=={version}; extra == \"converter\""
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel found in dist/")
          archive = zipfile.ZipFile(wheels[0])
          name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(name).decode()
          if expected not in metadata:
              print(metadata)
              sys.exit(f"lockstep pin missing from {wheels[0]}: expected {expected!r}")
          print(f"verified in {wheels[0]}: {expected}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  publish-python-wheel:
    name: Upload gwyddionpy to PyPI
    # Ordering is load-bearing: gwyddionpy publishes after the converter,
    # never in parallel. Its pin hard-requires the converter from this tag,
    # so a converter upload that failed while this one succeeded would ship
    # an extra that can never resolve, and PyPI forbids re-uploading.
    #
    # The reverse failure is harmless. Recovery is a re-run: both publish
    # steps set `skip-existing: true`, so only the failed upload retries.
    needs: [build-python-wheel, publish-converter-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gwyddionpy
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      # No repository-url: the action uploads to PyPI by default.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-converter-wheel:
    # Collect-and-upload only. The wheels are built by build-converter.yml's
    # `wheels` matrix (manylinux_2_28, macos-15 arm64, macos-15-intel,
    # windows-latest) and arrive here as artifacts of the same run.
    name: Publish gwyddionpy-converter wheels
    needs: build-converter
    runs-on: ubuntu-latest
    environment:
      name: pypi-converter
      url: https://pypi.org/p/gwyddionpy-converter
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - name: Collect the wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist/
          merge-multiple: true

      # Wheels only, never an sdist: an sdist would let pip fall back to
      # building Gwyddion from source on any machine without a matching
      # wheel. The count check catches the other failure — publishing an
      # empty dist/ "successfully" would silently break the lockstep pin.
      - name: Fail rather than publish an empty release
        run: |
          ls -l dist/
          count=$(ls dist/*.whl 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "no wheels collected — refusing to publish" >&2
            exit 1
          fi
          echo "$count wheel(s) ready"

      # No repository-url: the action uploads to PyPI by default.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
