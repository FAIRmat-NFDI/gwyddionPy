name: Build and publish gwyconvert

# Two ways in:
# - workflow_call: publish.yml's `build-converter` job `uses:` this and
#   both wheel-publish jobs `needs:` it, so the Rocky Linux 8 build below
#   runs exactly once per release and both wheels are gated on it
#   succeeding. No standalone `release:` trigger here: that would double
#   the (slow) build and race its own `--clobber` upload against the
#   called run.
# - pull_request: runs the same build (minus the release upload) on every
#   PR touching the converter, so a broken Rocky Linux 8 recipe fails CI
#   instead of only surfacing at release time.
#
# `tag` is passed explicitly as an input rather than read from
# github.event.release.tag_name: the full github.event payload isn't
# reliably forwarded into a called workflow (only github.sha/github.ref
# are guaranteed to match the caller's), so the caller passes it down.
# It's absent on pull_request runs, which is fine since those skip the
# upload step (there's no release to attach to).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "gwyddionpy-converter/**"
      - ".github/workflows/build-converter.yml"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  # ---------------------------------------------------------------------
  # Wheels: one py3-none wheel per platform via setup.py + cibuildwheel
  # (V1d; see V1_IMPLEMENTATION.md). The `linux` tarball job below is kept
  # unchanged alongside these — it feeds the GitHub Release asset that
  # gwyddionpy's _fetch_converter.py downloads, a shipped code path the
  # wheels do not replace. Retiring it is a recorded open decision, not an
  # omission.
  # ---------------------------------------------------------------------
  wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # -> py3-none-manylinux_2_28_x86_64
          - os: macos-15         # arm64 runner -> py3-none-macosx_*_arm64
          - os: macos-15-intel   # -> py3-none-macosx_*_x86_64
          - os: windows-latest   # -> py3-none-win_amd64
    steps:
      - uses: actions/checkout@v4

      # setuptools-scm cannot see .git from inside cibuildwheel's Linux
      # container (root=".." resolves outside the copied project), so the
      # version is always passed in explicitly. Release runs get it from
      # the tag (v0.0.9 -> 0.0.9, same stripping as the lockstep pin in
      # publish.yml); pull_request runs have no tag and use a throwaway
      # 0.0.0 — those wheels are build-checks, never published.
      - name: Set the wheel version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY_CONVERTER=$VERSION" >> "$GITHUB_ENV"

      # Windows only: the Gwyddion build needs a real MSYS2 MinGW64 shell,
      # which cibuildwheel's cmd-based hooks can't provide — so the bundle
      # is staged BEFORE cibuildwheel runs, and setup.py's
      # _check_bundle_present() guard makes any ordering mistake fail
      # loudly. See ci/build-windows-bundle.sh.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false

      - name: Build and stage the Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./gwyddionpy-converter/ci/build-windows-bundle.sh

      # macOS: the deployment target lands in the wheel's platform tag via
      # sysconfig.get_platform(). Pinned to the runner's own OS line and
      # not lower, deliberately: the Homebrew bottles the bundle is built
      # from are themselves built for this macOS version, so tagging the
      # wheel as older would promise compatibility the payload cannot keep.
      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Build the wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: gwyddionpy-converter
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  linux:
    name: Build gwyconvert (linux-x86_64)
    runs-on: ubuntu-latest
    # Built inside Rocky Linux 8 (glibc 2.28 — the same floor as the
    # manylinux_2_28 wheel standard) rather than on the runner's own
    # Ubuntu: glibc is forward-compatible only, so the bundle runs on
    # anything with glibc >= 2.28 (RHEL/Rocky/Alma 8+, Debian 10+,
    # Ubuntu 18.10+). A plain runner can't get anywhere near that —
    # ubuntu-22.04 is the oldest hosted image (glibc 2.35), which a real
    # user confirmed 2026-07-22 already excludes RHEL 9 (2.34); an
    # ubuntu-latest (24.04, glibc 2.39) build failed outright on Debian
    # bookworm (2.36). Verified locally in Docker 2026-07-22: this exact
    # recipe's bundle reports the same 170 formats on bookworm, Rocky 9,
    # and Ubuntu 20.04, incl. a real Bruker .spm conversion through
    # gwyddionpy.load() on bookworm. Not the official manylinux image on
    # purpose: it ships none of GTK2/GLib/FFTW/Pango (we'd be building
    # that whole stack from source); EL8 still packages all of them.
    container: rockylinux:8
    steps:
      # Everything below runs INSIDE the container, so dependencies (and
      # the gh CLI for the upload step) come from dnf, not the runner
      # image. Repo notes: fftw-devel lives in PowerTools (CRB), patchelf
      # in EPEL, gh in GitHub's own rpm repo.
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf -y install epel-release
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install \
            gcc-toolset-12 make pkgconf-pkg-config curl xz tar gzip bzip2 \
            python3 patchelf gawk file findutils diffutils git gh \
            gtk2-devel fftw-devel libxml2-devel gettext

      - uses: actions/checkout@v4

      # Builds Gwyddion itself from its official SourceForge release
      # tarball (not a distro package) — see V1_IMPLEMENTATION.md:
      # --without-gl drops the OpenGL/GLX/gtkglext dependency entirely.
      # gcc-toolset-12 is required, not optional: EL8's default GCC 8.5
      # rejects Gwyddion 2.71's OpenMP shared() clauses ("predetermined
      # 'shared'"); the toolset compiler still targets glibc 2.28.
      - name: Build, bundle, and package gwyconvert
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: in container jobs
        # the expression resolves to the runner's HOST path, not the
        # container mount (actions/runner#2058); the GITHUB_WORKSPACE env
        # var inside the step is always the container-correct one.
        run: |
          source /opt/rh/gcc-toolset-12/enable
          export OUT_DIR="$GITHUB_WORKSPACE/dist-converter"
          gwyddionpy-converter/ci/build-linux.sh

      - name: Upload to the release
        # github.event_name here still reads 'release' (the caller's
        # triggering event), not 'workflow_call' — known GH Actions
        # behavior, the event_name a called workflow sees is the
        # original one, not workflow_call. So gate on the `tag` input
        # itself: it's only ever set when publish.yml calls this
        # reusably; empty on the standalone pull_request trigger.
        if: inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Container jobs check out the repo with a different UID than the
          # one git sees at runtime, tripping the safe.directory ownership
          # guard (CVE-2022-24765) the moment `gh` shells out to git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "${{ inputs.tag }}" \
            dist-converter/gwyconvert-linux-x86_64.tar.gz \
            dist-converter/gwyconvert-linux-x86_64.tar.gz.sha256 \
            --clobber
