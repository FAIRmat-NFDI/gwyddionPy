name: Build and publish gwyconvert

# Builds the gwyconvert artifacts. Two entry points:
# - workflow_call — publish.yml calls this once per release, so both
#   publish jobs share one slow build. No `release:` trigger, deliberately:
#   that would build twice and race the two `--clobber` uploads.
# - pull_request — the same build without the upload.
#
# `tag` is an explicit input because a called workflow does not receive the
# caller's event payload. It is empty on pull requests, which is what the
# upload step gates on.
# https://docs.github.com/actions/sharing-automations/reusing-workflows
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "gwyddionpy-converter/**"
      - ".github/workflows/build-converter.yml"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  # One py3-none wheel per platform, via setup.py and cibuildwheel. The
  # `linux` job below separately produces the release tarball that
  # _fetch_converter.py downloads; both paths still ship.
  wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # -> py3-none-manylinux_2_28_x86_64
          - os: macos-15         # arm64 runner -> py3-none-macosx_*_arm64
          - os: macos-15-intel   # -> py3-none-macosx_*_x86_64
          - os: windows-latest   # -> py3-none-win_amd64
    steps:
      - uses: actions/checkout@v4

      # setuptools-scm cannot see .git from inside the build container, so
      # the version is passed in. Release runs strip the "v"; pull requests
      # have no tag and build a throwaway 0.0.0 that is never published.
      - name: Set the wheel version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GWYDDIONPY_CONVERTER=$VERSION" >> "$GITHUB_ENV"

      # Building Gwyddion from source takes about twenty minutes per
      # platform, and pytest.yml calls this workflow on every push. The key
      # covers everything that decides what ends up in the wheel, so a push
      # touching only tests or docs reuses the wheels.
      #
      # This workflow file is in the key too: it pins the runner images and
      # the cibuildwheel version, so a bump to either changes the wheel
      # without touching any file under gwyddionpy-converter/. The pinned
      # Gwyddion release needs no entry of its own — it lives under
      # [tool.gwyconvert] in pyproject.toml, which is already listed.
      #
      # Restored before the build steps rather than beside them, because on
      # Windows the costly part is staging the bundle under MSYS2, which
      # happens before cibuildwheel runs.
      #
      # Never on a release. `tag` sets the version compiled into the wheel
      # and the key does not cover it, so a tagged build must not be handed
      # a wheel built as 0.0.0.
      - name: Reuse the wheels when nothing that builds them has changed
        id: wheel-cache
        if: inputs.tag == ''
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: >-
            gwyconvert-${{ matrix.os }}-${{ hashFiles(
              'gwyddionpy-converter/gwyconvert.c',
              'gwyddionpy-converter/ci/**',
              'gwyddionpy-converter/Makefile',
              'gwyddionpy-converter/setup.py',
              'gwyddionpy-converter/pyproject.toml',
              'gwyddionpy-converter/MANIFEST.in',
              '.github/workflows/build-converter.yml') }}

      # Windows only: the Gwyddion build needs a real MSYS2 MinGW64 shell,
      # which cibuildwheel's cmd-based hooks cannot provide. The bundle is
      # staged in its own step before cibuildwheel, and setup.py's
      # _check_bundle_present() turns an ordering mistake into a loud
      # failure rather than an empty wheel.
      #
      # Changing this ordering, or these step names, means revisiting
      # gwyddionpy-converter/pyproject.toml [tool.cibuildwheel.windows].
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows' && steps.wheel-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false

      - name: Build and stage the Windows bundle
        if: runner.os == 'Windows' && steps.wheel-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./gwyddionpy-converter/ci/build-windows-bundle.sh

      # macOS: this value reaches the wheel's platform tag through
      # sysconfig.get_platform(). Pinned to the runner's own version, not
      # lower, because the bundle links Homebrew bottles built for it and
      # an older tag would promise compatibility the payload cannot
      # deliver. Raise it in step with the `macos-*` images above.
      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Build the wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: gwyddionpy-converter
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Produces the tarball attached to the GitHub Release, which
  # gwyddionpy's `gwyddionpy-fetch-converter` / _fetch_converter.py
  # downloads. Independent of the wheels above; renaming the asset here
  # means updating ci/build-linux.sh (ASSET_NAME) and
  # gwyddionpy/src/gwyddionpy/_fetch_converter.py (_asset_name) together.
  linux:
    name: Build gwyconvert (linux-x86_64)
    runs-on: ubuntu-latest
    # Rocky Linux 8, not the runner's Ubuntu. The C library is
    # forward-compatible only, so building against glibc 2.28 is what lets
    # the bundle run on RHEL/Rocky/Alma 8+, Debian 10+ and Ubuntu 18.10+.
    # The oldest hosted runner image would already exclude RHEL 9 and
    # Debian bookworm. 2.28 is also the floor the wheels use, so both
    # artifacts have the same reach. https://peps.python.org/pep-0600/
    #
    # Not the official manylinux image, which ships no GTK2, GLib, FFTW or
    # Pango and would mean building that whole stack from source too.
    container: rockylinux:8
    steps:
      # Runs inside the container, so every dependency comes from dnf and
      # not the runner image. fftw-devel is in PowerTools, patchelf in EPEL,
      # gh in GitHub's own repository.
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf -y install epel-release
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install \
            gcc-toolset-12 make pkgconf-pkg-config curl xz tar gzip bzip2 \
            python3 patchelf gawk file findutils diffutils git gh \
            gtk2-devel fftw-devel libxml2-devel gettext

      - uses: actions/checkout@v4

      # gcc-toolset-12 is required: the image's default GCC 8.5 rejects
      # Gwyddion 2.71's OpenMP shared() clauses, and the toolset compiler
      # still targets the same C library baseline.
      - name: Build, bundle, and package gwyconvert
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: in container jobs
        # the expression gives the host path, the env var the container one.
        # https://github.com/actions/runner/issues/2058
        run: |
          source /opt/rh/gcc-toolset-12/enable
          export OUT_DIR="$GITHUB_WORKSPACE/dist-converter"
          gwyddionpy-converter/ci/build-linux.sh

      # Outside a release the tarball was built and thrown away. Kept as an
      # artifact so pytest.yml can point GWYDDIONPY_ALT_CONVERT at it: it is
      # a genuinely independent build of the same sources — Rocky 8 and
      # build-linux.sh here, manylinux_2_28 and cibuildwheel for the wheel —
      # which is what makes comparing the two readings worth anything. It is
      # also the only test the released tarball itself gets.
      - name: Upload the tarball as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwyconvert-tarball-linux-x86_64
          path: dist-converter/gwyconvert-linux-x86_64.tar.gz

      - name: Upload to the release
        # Gated on `inputs.tag`, not event_name: a called workflow sees the
        # caller's event name, so it cannot tell the two entry points apart.
        # publish.yml always sets the tag; a pull request never does.
        if: inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Container jobs check out under a different user than git runs
          # as, tripping git's ownership guard once `gh` shells out to it.
          # https://nvd.nist.gov/vuln/detail/CVE-2022-24765
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "${{ inputs.tag }}" \
            dist-converter/gwyconvert-linux-x86_64.tar.gz \
            dist-converter/gwyconvert-linux-x86_64.tar.gz.sha256 \
            --clobber
