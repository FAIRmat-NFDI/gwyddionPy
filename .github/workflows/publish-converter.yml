name: Publish converter wheel to PyPI

# Same trigger as publish.yml/build-converter.yml (OQ7c: converter releases
# share the Python package's tag). This job additionally *depends on*
# build-converter.yml's linux-x86_64 asset already being attached to the
# release, but GitHub Actions has no cross-workflow `needs:`, and both
# workflows fire off the same `release: published` event with no ordering
# guarantee between them. So instead of assuming the asset is already
# there, this job polls for it (bounded wait) and fails loudly on timeout
# rather than silently publishing a wheel with no binary inside.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build gwyddionpy-converter wheel (linux-x86_64) and publish
    runs-on: ubuntu-latest
    environment:
      name: testpypi-converter
      url: https://test.pypi.org/p/gwyddionpy-converter
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
      ASSET: gwyconvert-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: setuptools-scm (root=".." in
          # gwyddionpy-converter/pyproject.toml) derives the version from
          # the same git tags as gwyddionpy itself.
          fetch-depth: 0

      - name: Wait for build-converter.yml's release asset
        run: |
          for i in $(seq 1 40); do
            if gh release view "$TAG" --json assets \
                 -q '.assets[].name' | grep -qx "$ASSET"; then
              echo "Found $ASSET on release $TAG"
              exit 0
            fi
            echo "Asset not yet on release $TAG, waiting (attempt $i/40)..."
            sleep 15
          done
          echo "::error::Timed out waiting for $ASSET on release $TAG (build-converter.yml may have failed)"
          exit 1

      - name: Download and verify the converter bundle
        run: |
          mkdir -p /tmp/converter-dl
          gh release download "$TAG" \
            --pattern "$ASSET" --pattern "$ASSET.sha256" \
            --dir /tmp/converter-dl
          (cd /tmp/converter-dl && sha256sum -c "$ASSET.sha256")

      - name: Extract into the wheel's package data
        run: |
          BIN_DIR="gwyddionpy-converter/src/gwyddionpy_converter/bin"
          mkdir -p "$BIN_DIR"
          tar xzf "/tmp/converter-dl/$ASSET" -C "$BIN_DIR"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: uv build --wheel ./gwyddionpy-converter --out-dir dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
