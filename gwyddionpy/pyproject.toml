[build-system]
requires = ["setuptools>=78.1.1", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gwyddionpy"
dynamic = ["version"]
authors = [
    { name = "The NOMAD Authors" },
]
description = "Read any Gwyddion-supported SPM raw file into NumPy via the gwyconvert helper"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "gwyfile>=0.3",
    "platformdirs>=3.0",
    "gwyddionpy-converter"
]

[project.urls]
"Homepage" = "https://github.com/FAIRmat-NFDI/gwyddionPy"
"Parent Project" = "https://github.com/FAIRmat-NFDI"

[project.scripts]
gwyddionpy-fetch-converter = "gwyddionpy._fetch_converter:_main"

[project.optional-dependencies]
hdf5 = ["h5py>=3.0"]
test = ["pytest>=7", "h5py>=3.0", "pooch>=1.6"]
dev = [
    "mypy",
    "ruff>=0.14.0",
    "pytest",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# gwyddionpy-converter is only published to TestPyPI so far, while
# numpy/gwyfile/platformdirs etc. only exist on real PyPI: index-url is
# checked first, extra-index-url as fallback for everything else.
index-url = "https://test.pypi.org/simple"
extra-index-url = ["https://pypi.org/simple"]

[tool.setuptools_scm]
root = ".."
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.ruff]
include = ["src/gwyddionpy/*.py", "src/gwyddionpy/**/*.py", "tests/*.py"]
lint.select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "PL", # pylint
    "NPY201", # upgrade to numpy>2
]
lint.ignore = [
    "E501", # Line too long ({width} > {limit} characters)
    "E701", # Multiple statements on one line (colon)
    "E731", # Do not assign a lambda expression, use a def
    "E402",  # Module level import not at top of file
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used instead of constant
    "PLW0603", # Using the global statement
    "PLW2901", # redefined-loop-name
    "PLR1714", # consider-using-in
    "PLR5501", # else-if-used
    "PLC0415", # import outside-toplevel
]
lint.fixable = ["ALL"]

[tool.mypy]
strict = false
ignore_missing_imports = true
follow_imports = "silent"
no_strict_optional = true
disable_error_code = "import, annotation-unchecked"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: tests needing full-size raw files fetched from the corpus host",
    "converter: tests needing a built gwyconvert binary",
]
